name: Analytical checks
on:
  push:
    branches: [ekimetrics-decision-lab]
  pull_request:
    branches: [ekimetrics-decision-lab]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
      - run: node --check dist/assets/app.js
      - run: node --check dist/assets/story.js
      - run: node --check dist/assets/purpose.js
